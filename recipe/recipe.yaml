schema_version: 1

context:
  version: "0.0.13"

package:
  name: transfunctions
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/transfunctions/transfunctions-${{ version }}.tar.gz
  sha256: e190dcc35cab86e29a65578151925d9a34915d1344a577c9a5b65dcc34cf92fd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools ==68.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - displayhooks >=0.0.7
    - getsources >=0.0.4
    

tests:
  - python:
      imports:
        - transfunctions
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Say NO to Python fragmentation on sync and async
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/mutating/transfunctions

extra:
  recipe-maintainers:
    - thewchan
